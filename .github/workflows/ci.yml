name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.97.1

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc -Vv
      - name: Default tests
        run: cargo test --locked
      - name: Backend candidate correctness
        run: cargo test --locked --features bench-internals
      - name: no_std + libm tests
        run: cargo test --locked --no-default-features --features libm
      - name: no_std + libm + digest tests
        run: cargo test --locked --no-default-features --features libm,digest

  quality:
    name: Format, clippy, package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Package
        run: cargo package --locked

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustc -Vv
      - name: Check library at MSRV
        run: cargo check --locked --lib --all-features
      - name: Check no_std library at MSRV
        run: cargo check --locked --lib --no-default-features --features libm,digest

  backend-probe:
    name: Backend probe (${{ matrix.arch }})
    needs: [test, quality, msrv]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            filter: backend-x86
          - arch: aarch64
            runner: ubuntu-24.04-arm
            filter: backend-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc -Vv
      - name: Fingerprint runner
        run: .github/scripts/fingerprint-runner.sh backend-probe-runner.txt
      - name: Backend candidate correctness
        run: cargo test --locked --features bench-internals
      - name: Same-binary backend microbenchmarks
        run: |
          cargo bench --locked --features bench-internals --bench backends -- \
            "${{ matrix.filter }}" --noplot 2>&1 | tee backend-probe.txt
      - name: Upload backend probe data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-probe-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            backend-probe-runner.txt
            backend-probe.txt
            target/criterion/backend-*
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: Performance guard (${{ matrix.arch }})
    needs: [test, quality, msrv]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            sentinels: single-stream-1MiB|many-65536-bytes|x86-two-message-near-64KiB|x86-small-skew|?x86-small-batch
          - arch: aarch64
            runner: ubuntu-24.04-arm
            sentinels: single-stream-1MiB|many-65536-bytes|lane-fill-64KiB|batch-scaling-8|batch-scaling-12|batch-scaling-16|batch-scaling-20|batch-scaling-28|mixed-short|mixed-4x~64KiB|mixed-8x~64KiB|mixed-12x~64KiB
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      PERF_SAMPLE_SIZE: 20
      PERF_WARMUP_SECONDS: 1
      PERF_MEASUREMENT_SECONDS: 2
    steps:
      - name: Checkout PR candidate
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout branch candidate
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: head
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout PR baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release baseline
        if: github.event_name != 'pull_request'
        run: |
          baseline=$(head/.github/scripts/resolve-perf-baseline.sh head "")
          echo "PERF_BASE_REF=$baseline" >> "$GITHUB_ENV"
          git -C head worktree add --detach "$GITHUB_WORKSPACE/base" "$baseline"
          echo "Performance baseline ref: $baseline" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve comparison SHAs
        run: |
          echo "PERF_BASE_SHA=$(git -C base rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PERF_HEAD_SHA=$(git -C head rev-parse HEAD)" >> "$GITHUB_ENV"
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            echo "PR baseline: ${{ github.event.pull_request.base.sha }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Branch/manual performance runs compare the candidate with the previous reachable release." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Performance runs only after test, quality, and MSRV jobs succeed." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Fingerprint runner
        run: head/.github/scripts/fingerprint-runner.sh head/perf-runner.txt

      - name: Fetch dependencies before measuring
        run: |
          cargo fetch --locked --manifest-path base/Cargo.toml
          cargo fetch --locked --manifest-path head/Cargo.toml

      - name: Paired Criterion sentinel run
        env:
          PERF_BASE_TARGET: ${{ runner.temp }}/perf-base
          PERF_HEAD_TARGET: ${{ runner.temp }}/perf-head
          PERF_BASELINE_NAME: ci-pair
          PERF_REPORT_ROOT: ${{ runner.temp }}/perf-report
          PERF_FILTERS: ${{ matrix.sentinels }}
        run: |
          head/.github/scripts/run-perf-pair.sh \
            base/Cargo.toml \
            head/Cargo.toml \
            "$PERF_FILTERS"

      - name: Evaluate regressions
        env:
          PERF_REPORT_ROOT: ${{ runner.temp }}/perf-report
        run: |
          python3 head/.github/scripts/perf-guard.py \
            "$PERF_REPORT_ROOT" \
            --base-sha "$PERF_BASE_SHA" \
            --head-sha "$PERF_HEAD_SHA" \
            --json-out head/perf-guard.json

      - name: Upload benchmark data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-performance-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            head/perf-runner.txt
            head/perf-guard.json
            ${{ runner.temp }}/perf-report
            ${{ runner.temp }}/perf-base/criterion
            ${{ runner.temp }}/perf-head/criterion
          if-no-files-found: warn
          retention-days: 14
