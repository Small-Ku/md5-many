name: Full performance

on:
  workflow_dispatch:
    inputs:
      compare_ref:
        description: Optional baseline ref override (blank = latest previous reachable release tag)
        required: false
        default: ''
        type: string
      enforce:
        description: Fail the run on a confirmed regression
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: perf-manual-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: 1.97.1
  PERF_SAMPLE_SIZE: 20
  PERF_WARMUP_SECONDS: 1
  PERF_MEASUREMENT_SECONDS: 2

jobs:
  full:
    name: Full performance (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: head
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve performance baseline
        env:
          PERF_COMPARE_REF_OVERRIDE: ${{ inputs.compare_ref }}
        run: |
          baseline=$(head/.github/scripts/resolve-perf-baseline.sh head "$PERF_COMPARE_REF_OVERRIDE")
          echo "PERF_BASE_REF=$baseline" >> "$GITHUB_ENV"
          echo "Selected performance baseline: $baseline"

      - name: Materialize release baseline
        run: git -C head worktree add --detach "$GITHUB_WORKSPACE/base" "$PERF_BASE_REF"

      - name: Resolve comparison SHAs
        run: |
          echo "PERF_BASE_SHA=$(git -C base rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PERF_HEAD_SHA=$(git -C head rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Performance baseline ref: $PERF_BASE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Fingerprint runner
        run: head/.github/scripts/fingerprint-runner.sh head/perf-runner.txt

      - name: Fetch dependencies before measuring
        run: |
          cargo fetch --locked --manifest-path base/Cargo.toml
          cargo fetch --locked --manifest-path head/Cargo.toml

      - name: Full paired Criterion run
        env:
          PERF_BASE_TARGET: ${{ runner.temp }}/perf-base
          PERF_HEAD_TARGET: ${{ runner.temp }}/perf-head
          PERF_BASELINE_NAME: manual-pair
          PERF_REPORT_ROOT: ${{ runner.temp }}/perf-report
        run: |
          head/.github/scripts/run-perf-pair.sh \
            base/Cargo.toml \
            head/Cargo.toml \
            ALL

      - name: Evaluate regressions
        env:
          PERF_REPORT_ROOT: ${{ runner.temp }}/perf-report
        run: |
          extra=()
          if [[ "${{ inputs.enforce }}" != true ]]; then
            extra+=(--no-fail)
          fi
          python3 head/.github/scripts/perf-guard.py \
            "$PERF_REPORT_ROOT" \
            --base-sha "$PERF_BASE_SHA" \
            --head-sha "$PERF_HEAD_SHA" \
            --json-out head/perf-guard.json \
            "${extra[@]}"

      - name: Upload benchmark data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-performance-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            head/perf-runner.txt
            head/perf-guard.json
            ${{ runner.temp }}/perf-report
            ${{ runner.temp }}/perf-base/criterion
            ${{ runner.temp }}/perf-head/criterion
          if-no-files-found: warn
          retention-days: 14
